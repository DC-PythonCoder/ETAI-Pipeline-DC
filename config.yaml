data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"                            # never a feature; used only for the fairness report
  drop_columns: ["id", "decile_score", "score_text"]  # kept in the data, never used as features

# Locked test set: never used to fit, tune or choose anything. Do not change once set.
test_set:
  size: 0.2
  random_state: 42

cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  scoring: "accuracy"   # one metric for now, so numbers compare directly with weeks 2-3
  n_jobs: 1             # -1 = all CPU cores

diagnostics:
  id_column: "id"
  numeric_text_columns: ["priors_count", "prior_offenses"]
  # "nan" catches real NaNs turned into text by the category cleanup.
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", "", "nan"]
  validity_rules:
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    priors_count: {min: 0, max: 60}
  canonical_categories:
    sex:
      male: "Male"
      female: "Female"
    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"
  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"]

# The preprocessing recipe (week 4 -- see Practical/W4/notebooks/02_preprocessing.ipynb). Every step here is
# FITTED on training rows only, inside the model's Pipeline. Encoder and scaler are chosen by hand for now
# (reasons below).
preprocessing:
  # options: "onehot" | "ordinal" | "count" | "target"
  encoder: "target"      # compact (1 column per feature) and informative; sklearn's version cross-fits, so no leak
  # options: "none" | "standard" | "minmax" | "robust"
  scaler: "robust"       # median/IQR: the few extreme counts (e.g. priors_count) don't set the scale for everyone
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  # MNAR-diagnosed columns (see diagnostics above / the EDA notebook's mechanism test) get an
  # extra "_was_missing" flag alongside their imputed value, so the model can still see the
  # pattern even though the fill itself is just a median/mode
  mnar_indicator_sources: ["priors_count", "c_charge_degree"]
  # seed for the target encoder's internal cross-fitting (week 4: sklearn's TargetEncoder)
  random_state: 42
  imputation:
    numeric_strategy: "median"        # applies to age, juv_fel_count, juv_misd_count, juv_other_count, priors_count
    categorical_strategy: "most_frequent"   # applies to sex, age_cat, c_charge_degree

model:
  type: "decision_tree" # logistic_regression | decision_tree | random_forest
  params:
    # bumped from 1000 -- with this week's encoder/scaler pair in place, 1000 iterations
    # was cutting lbfgs off before it converged (a ConvergenceWarning, not a real problem,
    # but worth just giving it enough room rather than living with the warning)
    #max_iter: 2000
  #Decision Tree
    #params:
    #max_depth: 8
    #min_samples_split: 10
    #min_samples_leaf: 5
    random_state: 42
  # Random Forest example -- swap the two lines above for these to run it:
  # type: "random_forest"
  # params:
     #n_estimators: 300
     #random_state: 42   # fixed seed
     #n_jobs: -1         # -1 = all CPU cores

tuning:
  enabled: true
  n_trials: 30
  n_splits: 5                                       # folds that score each candidate
  random_state: 42                                  # seeds the sampler and those folds
  # Keys are Pipeline parameter names. Types: int / float (low, high, log) or categorical (choices).
  search_spaces:
    decision_tree:
      model__max_depth: {type: int, low: 1, high: 20}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__criterion: {type: categorical, choices: ["gini", "entropy"]}

output:
  results_dir: "results"   # each run's full report is saved here as a timestamped .txt file